<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem; }

        .header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 1.5rem;
        }
        h1 { font-size: 22px; font-weight: 500; }

        .add-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px;
            background: #534AB7; color: #EEEDFE;
            font-size: 14px; font-weight: 500; text-decoration: none;
        }
        .add-btn:hover { background: #3C3489; }

        .table-wrap {
            background: #fff; border: 0.5px solid rgba(0,0,0,0.15);
            border-radius: 12px; overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        thead tr { background: #EEEDFE; }
        thead th {
            padding: 12px 16px; text-align: left;
            font-size: 12px; font-weight: 500;
            letter-spacing: 0.04em; text-transform: uppercase;
            color: #3C3489; border-bottom: 0.5px solid #AFA9EC;
        }
        tbody tr { border-bottom: 0.5px solid rgba(0,0,0,0.08); }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f9f9f7; }
        tbody td { padding: 12px 16px; vertical-align: middle; }
        tbody td:first-child { font-size: 12px; color: #888; font-weight: 500; }
    </style>
</head>
<body>

<div class="header">
    <h1>Data User</h1>
    <a href="/tambah" class="add-btn">+ Tambah User</a>
</div>

<div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nama}"></td>
                <td th:text="${u.email}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
