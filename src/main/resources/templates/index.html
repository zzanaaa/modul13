<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            background:linear-gradient(135deg,#f4f6fb,#eef1ff);
            min-height:100vh;
            padding:40px;
        }

        .container{
            max-width:1100px;
            margin:auto;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .title{
            font-size:32px;
            font-weight:700;
            color:#2d2d2d;
        }

        .subtitle{
            color:#777;
            margin-top:5px;
        }

        .add-btn{
            display:flex;
            align-items:center;
            gap:8px;
            padding:12px 20px;
            border-radius:12px;
            text-decoration:none;
            background:linear-gradient(135deg,#534AB7,#7167E8);
            color:white;
            font-weight:600;
            transition:0.3s;
            box-shadow:0 8px 20px rgba(83,74,183,.25);
        }

        .add-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 25px rgba(83,74,183,.35);
        }

        .card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .card-header{
            background:linear-gradient(135deg,#534AB7,#7167E8);
            color:white;
            padding:20px 25px;
        }

        .card-header h2{
            font-size:20px;
            font-weight:600;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        thead{
            background:#f6f7ff;
        }

        thead th{
            padding:18px;
            text-align:left;
            font-size:13px;
            text-transform:uppercase;
            color:#534AB7;
            letter-spacing:1px;
        }

        tbody td{
            padding:18px;
            border-top:1px solid #eee;
            color:#444;
        }

        tbody tr{
            transition:.2s;
        }

        tbody tr:hover{
            background:#fafbff;
        }

        .id-badge{
            background:#EEEDFE;
            color:#534AB7;
            padding:6px 12px;
            border-radius:20px;
            font-weight:600;
            font-size:13px;
        }

        .email{
            color:#666;
        }

        .user-icon{
            color:#534AB7;
            margin-right:8px;
        }

        .empty{
            text-align:center;
            padding:30px;
            color:#999;
        }

        @media(max-width:768px){
            .header{
                flex-direction:column;
                gap:15px;
                align-items:flex-start;
            }

            table{
                display:block;
                overflow-x:auto;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div>
            <h1 class="title">👥 Data User</h1>
            <p class="subtitle">Kelola data pengguna sistem</p>
        </div>

        <a href="/tambah" class="add-btn">
            <i class="ti ti-plus"></i>
            Tambah User
        </a>
    </div>

    <div class="card">

        <div class="card-header">
            <h2>Daftar Pengguna</h2>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="u : ${users}">
                    <td>
                        <span class="id-badge" th:text="${u.id}"></span>
                    </td>

                    <td>
                        <i class="ti ti-user user-icon"></i>
                        <span th:text="${u.nama}"></span>
                    </td>

                    <td class="email" th:text="${u.email}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="3" class="empty">
                        Belum ada data user.
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
