<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tambah User</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f5f5f0; color: #1a1a1a; padding: 2rem; }

        .page { max-width: 480px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 13px; color: #888; text-decoration: none; margin-bottom: 1.5rem;
        }
        .back-link:hover { color: #1a1a1a; }

        h1 { font-size: 22px; font-weight: 500; margin-bottom: 1.5rem; }

        .card {
            background: #fff;
            border: 0.5px solid rgba(0,0,0,0.12);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .field { margin-bottom: 1.25rem; }
        label {
            display: block; font-size: 13px; font-weight: 500;
            color: #666; margin-bottom: 6px;
        }
        input[type="text"], input[type="email"] {
            width: 100%; padding: 9px 12px;
            border: 0.5px solid rgba(0,0,0,0.25);
            border-radius: 8px; font-size: 14px;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus {
            border-color: #534AB7;
            box-shadow: 0 0 0 3px rgba(83,74,183,0.12);
        }

        .actions { display: flex; align-items: center; gap: 10px; margin-top: 1.5rem; }

        .btn-submit {
            padding: 9px 20px; border-radius: 8px;
            background: #534AB7; color: #EEEDFE;
            font-size: 14px; font-weight: 500;
            border: none; cursor: pointer;
        }
        .btn-submit:hover { background: #3C3489; }

        .btn-cancel {
            padding: 9px 16px; border-radius: 8px;
            background: transparent; color: #666;
            font-size: 14px; border: 0.5px solid rgba(0,0,0,0.2);
            cursor: pointer; text-decoration: none;
        }
        .btn-cancel:hover { background: #f5f5f0; }
    </style>
</head>
<body>

<div class="page">
    <a href="/" class="back-link">← Kembali</a>
    <h1>Tambah User</h1>

    <div class="card">
        <form action="/simpan" method="post" th:object="${user}">
            <div class="field">
                <label for="nama">Nama</label>
                <input type="text" id="nama" th:field="*{nama}" placeholder="Masukkan nama lengkap">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="contoh@email.com">
            </div>
            <div class="actions">
                <button type="submit" class="btn-submit">Simpan</button>
                <a href="/" class="btn-cancel">Batal</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
